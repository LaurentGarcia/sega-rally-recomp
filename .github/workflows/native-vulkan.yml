name: Native Vulkan ROM-free CRT
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native Vulkan development files and software driver
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libvulkan-dev mesa-vulkan-drivers
      - name: Execute common CRT SPIR-V through native Vulkan without SDL
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: python3 tests/test_native_vulkan_crt.py --output build/native-vulkan-ci --require-software
      - name: Show gate outcome
        if: always()
        run: |
          find build/native-vulkan-ci -maxdepth 1 -name '*.stdout' -o -name '*.stderr' -o -name 'result.json' | sort | xargs -r -I '{}' sh -c 'echo "--- {}"; cat "{}"'
