name: PS2 portability and bringup
on:
  push:
    paths: ['platform/ps2/**', 'platform/segarally/stage_data.py', 'src/runtime/**', 'src/app/gpu/model2_*', 'src/trace/trace.h', 'scripts/segarally_recompile.py', 'scripts/segarally_sound_recompile.py', 'config/segarally_*.json', 'tests/test_ps2*.py', 'tests/test_model2a_paged_rom.cpp', 'tests/test_model2_scsp.cpp', 'tests/test_video_gpu_storage.cpp', 'tests/test_video_compact.cpp', '.github/workflows/ps2.yml']
  pull_request:
    paths: ['platform/ps2/**', 'platform/segarally/stage_data.py', 'src/runtime/**', 'src/app/gpu/model2_*', 'src/trace/trace.h', 'scripts/segarally_recompile.py', 'scripts/segarally_sound_recompile.py', 'config/segarally_*.json', 'tests/test_ps2*.py', 'tests/test_model2a_paged_rom.cpp', 'tests/test_model2_scsp.cpp', 'tests/test_video_gpu_storage.cpp', 'tests/test_video_compact.cpp', '.github/workflows/ps2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check bounded asset storage, shared memory bus and build boundaries
        run: python3 -m unittest discover -s tests -p 'test_ps2*.py' -v
      - name: Run the portable presentation and controller smoke test
        run: python3 platform/ps2/build_ps2.py smoke --output build/ps2-ci
      - name: Verify the native rewrite source boundary without arcade runtime
        run: python3 platform/ps2/build_ps2.py smoke --target native-port --output build/ps2-native-ci
      - name: Verify the independent original application's engine boundary
        run: python3 platform/ps2/build_ps2.py smoke --target engine-demo --output build/ps2-engine-ci
  ee-cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull the immutable official PS2dev compiler image
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          lock = json.loads(Path('platform/ps2/toolchain.lock.json').read_text())
          image = lock['platforms']['linux/amd64']['image']
          subprocess.run(['docker', 'pull', '--platform', 'linux/amd64', image], check=True)
          PY
      - name: Cross-link the ROM-free GS and controller bringup ELF
        run: python3 platform/ps2/build_ps2.py build --backend docker --container-platform linux/amd64 --output build/ps2-ci --jobs 2
      - name: Inspect EE entry point and static RAM footprint
        run: python3 platform/ps2/build_ps2.py report --backend docker --container-platform linux/amd64 --output build/ps2-ci
      - name: Cross-link the original IOP SPU2 PCM fixture
        run: python3 platform/ps2/build_ps2.py build --target audio-fixture --backend docker --container-platform linux/amd64 --output build/ps2-audio-ci --jobs 2
      - name: Enforce the native rewrite boundary and cross-link its bootstrap
        run: python3 platform/ps2/build_ps2.py build --target native-port --backend docker --container-platform linux/amd64 --output build/ps2-native-ci --jobs 2
      - name: Cross-link the original application without Rally game or study code
        run: python3 platform/ps2/build_ps2.py build --target engine-demo --backend docker --container-platform linux/amd64 --output build/ps2-engine-ci --jobs 2
      - name: Compare both applications' shared engine source identities
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          native = json.loads(Path('build/ps2-native-ci/build-native-port.json').read_text())
          demo = json.loads(Path('build/ps2-engine-ci/build-engine-demo.json').read_text())
          assert native['status'] == demo['status'] == 'cross_compiled'
          assert native['shared_engine'] == demo['shared_engine']
          print('Shared engine source manifest:', demo['shared_engine']['manifest_sha256'])
          PY
      - name: Cross-link the original VU0 and VU1 numerical fixture
        run: python3 platform/ps2/tools/build_vu1_fixture.py --dual-unit --trailing-nop-qword --output build/ps2-vu1-ci
      - name: Cross-link the original native GS depth readback fixture
        run: python3 platform/ps2/tools/build_native_depth_fixture.py --container-platform linux/amd64 --output build/ps2-native-depth-ci
      - name: Cross-link the native mesh framebuffer capture fixture without assets
        run: python3 platform/ps2/tools/build_native_depth_fixture.py --scene-capture --container-platform linux/amd64 --output build/ps2-native-scene-ci
      - name: Cross-link the original GS resource lifetime and failure fixture
        run: python3 platform/ps2/tools/build_native_resource_fixture.py --container-platform linux/amd64 --output build/ps2-native-resources-ci
      - name: Cross-link the recovered course-neighbor arithmetic fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/contact_neighborhood_manifest.json --container-platform linux/amd64 --output build/ps2-contact-neighborhood-ci --jobs 2
      - name: Cross-link the recovered car direction arithmetic fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/direction_blend_manifest.json --container-platform linux/amd64 --output build/ps2-direction-blend-ci --jobs 2
      - name: Cross-link the recovered alternate orientation fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/alternate_orientation_manifest.json --container-platform linux/amd64 --output build/ps2-alternate-orientation-ci --jobs 2
      - name: Cross-link the recovered projected contact fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/contact_projection_manifest.json --container-platform linux/amd64 --output build/ps2-contact-projection-ci --jobs 2
      - name: Cross-link the recovered cabinet steering fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/cabinet_steering_manifest.json --container-platform linux/amd64 --output build/ps2-cabinet-steering-ci --jobs 2
      - name: Cross-link the recovered cabinet steering filter fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/cabinet_steering_filter_manifest.json --container-platform linux/amd64 --output build/ps2-cabinet-steering-filter-ci --jobs 2
      - name: Cross-link the recovered course-contact search fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/contact_search_manifest.json --container-platform linux/amd64 --output build/ps2-contact-search-ci --jobs 2
      - name: Cross-link the main-car pose publication fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/main_car_pose_manifest.json --container-platform linux/amd64 --output build/ps2-main-car-pose-ci --jobs 2
      - name: Cross-link the rounded contact cross-product fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/rounded_cross_product_manifest.json --container-platform linux/amd64 --output build/ps2-rounded-cross-ci --jobs 2
      - name: Cross-link the rounded affine point-transform fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/rounded_affine_transform_manifest.json --container-platform linux/amd64 --output build/ps2-rounded-affine-ci --jobs 2
      - name: Cross-link the native contact-result fixture with original synthetic normal data
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/contact_result_manifest.json --container-platform linux/amd64 --output build/ps2-contact-result-ci --jobs 2
      - name: Cross-link the native contact-direction normalization fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/contact_normalization_manifest.json --container-platform linux/amd64 --output build/ps2-contact-normalization-ci --jobs 2
      - name: Cross-link the native recovered scalar metric fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/recovered_scalar_metric_manifest.json --container-platform linux/amd64 --output build/ps2-recovered-scalar-metric-ci --jobs 2
      - name: Cross-link the native contact accumulation and state update fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/contact_aggregate_manifest.json --container-platform linux/amd64 --output build/ps2-contact-aggregate-ci --jobs 2
      - name: Cross-link the native per-contact force fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/contact_response_manifest.json --container-platform linux/amd64 --output build/ps2-contact-response-ci --jobs 2
      - name: Cross-link the native response-pass fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/contact_pass_response_manifest.json --container-platform linux/amd64 --output build/ps2-contact-pass-response-ci --jobs 2
      - name: Cross-link the native contact-point preparation fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/contact_point_preparation_manifest.json --container-platform linux/amd64 --output build/ps2-contact-point-preparation-ci --jobs 2
      - name: Cross-link the native candidate-contact pass fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/candidate_contact_pass_manifest.json --container-platform linux/amd64 --output build/ps2-candidate-contact-pass-ci --jobs 2
      - name: Cross-link the native main candidate preparation fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/main_candidate_manifest.json --container-platform linux/amd64 --output build/ps2-main-candidate-ci --jobs 2
      - name: Cross-link the native main contact-slot fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/main_contact_slot_manifest.json --container-platform linux/amd64 --output build/ps2-main-contact-slot-ci --jobs 2
      - name: Cross-link the native paired balance and parameter selection fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/paired_balance_manifest.json --container-platform linux/amd64 --output build/ps2-paired-balance-ci --jobs 2
      - name: Cross-link the native joined candidate and contact-step fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/main_contact_step_manifest.json --container-platform linux/amd64 --output build/ps2-main-contact-step-ci --jobs 2
      - name: Cross-link the native balance geometry tail fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/main_balance_geometry_manifest.json --container-platform linux/amd64 --output build/ps2-main-balance-geometry-ci --jobs 2
      - name: Cross-link the native segment-selection fixture
        run: python3 platform/ps2/build_ps2.py build --target core-probe --core-manifest platform/ps2/tests/segment_selection_manifest.json --container-platform linux/amd64 --output build/ps2-segment-selection-ci --jobs 2
      # No ROMs, generated game core, signing secrets or artifact publication.
      # This job proves cross-linking; console execution is a separate test.
