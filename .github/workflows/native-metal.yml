name: Native Metal compile and link
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apple-sdk-compile-link:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure direct Metal library and native fixture clients
        run: cmake -S platform/segarally/native-metal -B build/native-metal-ci -DCMAKE_BUILD_TYPE=Release
      - name: Compile and link without SDL or game data
        run: cmake --build build/native-metal-ci --config Release --parallel 2
      - name: Verify linked fixtures have no SDL dependency
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          for name in ('test_native_metal_model2', 'test_native_metal_crt'):
              binary = Path('build/native-metal-ci') / name
              linkage = subprocess.check_output(['otool', '-L', str(binary)], text=True)
              symbols = subprocess.check_output(['nm', '-u', str(binary)], text=True)
              print(linkage)
              if 'SDL' in linkage or '_SDL_' in symbols:
                  raise SystemExit(f'Unexpected SDL dependency in {name}')
          print('Compile/link checks passed. GPU execution is covered by local hardware validation.')
          PY
